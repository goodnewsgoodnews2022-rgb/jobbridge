name: jobbridge
description: JobBridge — Connecting talent with opportunity.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Routing
  go_router: ^14.2.0

  # State
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend
  supabase_flutter: ^2.5.6

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.5
  timeago: ^3.7.0
  job: ^1.0.0
  flutter_test:
    sdk: flutter
  features: ^1.1.0-nullsafety
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true